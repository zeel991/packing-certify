[project]
name = "packing-certify"
version = "0.1.0"
description = "Exact verification, polishing and rigorous local-optimality certificates for the public AlphaEvolve circle packings"
readme = "README.md"
authors = [
    { name = "zeel991", email = "darjizeel587@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "mpmath>=1.4.1",
    "numpy>=2.5.4",
    "python-flint>=0.9.0",
    "scipy>=1.18.1",
]

[project.scripts]
packing-certify = "packing_certify.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
